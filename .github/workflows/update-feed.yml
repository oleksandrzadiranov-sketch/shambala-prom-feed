name: Update Shambala Prom feed

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * *"

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Prom feed
        env:
          MIN_PRICE: "2000"
          MAX_PRODUCTS: "3000"
          REQUEST_DELAY: "1.0"
        run: python shambala_to_prom.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prom_feed.xml
          git diff --cached --quiet || git commit -m "Update Prom feed"
          git push
